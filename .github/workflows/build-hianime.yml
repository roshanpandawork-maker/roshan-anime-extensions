name: Build HiAnime extension

on:
  push:
    branches: [main]
    paths:
      - "src/en/hianime/**"
      - ".github/workflows/build-hianime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-hianime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out archived Aniyomi extension build environment
        uses: actions/checkout@v4
        with:
          repository: aniyomiorg/aniyomi-extensions
          ref: master
          path: aniyomi-build

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: aniyomi-build/**/gradle-wrapper.properties

      - name: Refresh unavailable legacy Injekt dependency
        working-directory: aniyomi-build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gradle/libs.versions.toml")
          text = path.read_text()
          old = 'injekt-core = { module = "com.github.inorichi.injekt:injekt-core", version = "65b0440" }'
          new = 'injekt-core = { module = "com.github.null2264.injekt:injekt-core", version = "4135455a2a" }'
          if old not in text:
              raise SystemExit("Expected legacy Injekt dependency declaration was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Copy HiAnime module into build environment
        run: |
          mkdir -p aniyomi-build/src/en/hianime
          cp -R src/en/hianime/. aniyomi-build/src/en/hianime/

      - name: Configure isolated module build
        working-directory: aniyomi-build
        run: |
          cat > settings.gradle.kts <<'EOF'
          apply(from = "repositories.gradle.kts")
          include(":core")
          include("src:en:hianime")
          EOF

      - name: Build debug APK
        working-directory: aniyomi-build
        run: ./gradlew --no-daemon :src:en:hianime:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hianime-debug-apk
          path: aniyomi-build/src/en/hianime/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
